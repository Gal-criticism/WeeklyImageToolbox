[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame-news"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "Pillow>=10.0",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9,<10",
  "yt-dlp>=2024.1",
]

[project.optional-dependencies]
desktop = [
  "PySide6==6.9.2",
  "keyring==25.3.0",
]
dev = [
  "pytest==8.4.2",
  "pytest-qt==4.4.0",
]
build = [
  "PyInstaller==6.11.1",
]
visual = [
  "open_clip_torch>=2.24",
]
browser = [
  "playwright==1.63.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"galgame_news.desktop" = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
